name: Deploy to Azure Container Apps

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: acrmlopscorazon.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: acrmlopscorazon.azurecr.io/ml-api:latest

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Container Apps
      run: |
        az containerapp up --name api-mi-proyecto --resource-group rg-mlops-corazon --environment env-corazon-ean --image acrmlopscorazon.azurecr.io/ml-api:latest --ingress external --target-port 8000